[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shuiyuan-auto-reply"
version = "1.1.0"
description = "A Discourse forum auto-reply bot built on LangChain/LangGraph and DeepSeek."
authors = [{ name = "Hydroiodic_Acid", email = "liao_chengfan@sjtu.edu.cn" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "aiosqlite",
    "beautifulsoup4",
    "dacite",
    "httpx[socks]",
    "langchain-core>=1.6,<1.7",
    "langchain-openai>=1.6,<1.7",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langgraph>=1.2.11,<1.3",
    "langgraph-prebuilt>=1.1,<1.2",
    "langgraph-checkpoint-postgres",
    "markdownify==1.2.0",
    "openai>=3.3.1,<4",
    "pillow",
    "python-dotenv",
    "sqlalchemy",
    "greenlet>=3.5.0",
    "cryptography",
]

[project.optional-dependencies]
dev = ["black", "isort", "pytest>=9.0.3"]
local-embedding = ["sentence-transformers"]
neo4j = ["neomodel"]
server = ["fastapi[all]"]

[project.scripts]
shuiyuan-ops = "shuiyuan_auto_reply.interfaces.cli.ops:main"
shuiyuan-bot = "shuiyuan_auto_reply.interfaces.cli.main:bot_main"
shuiyuan-api = "shuiyuan_auto_reply.interfaces.cli.main:api_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shuiyuan_auto_reply*"]

[tool.setuptools.package-data]
shuiyuan_auto_reply = [
    "prompts/manifest.json",
    "prompts/legacy_defaults.json",
    "prompts/personas/*.txt",
    "prompts/policies/*.txt",
    "prompts/capabilities/*.txt",
    "interfaces/api/static/**/*",
    "assets/pet_responses.json",
    "assets/pet_endings.json",
]

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["test"]
