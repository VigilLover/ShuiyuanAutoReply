name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate main ancestry and version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)",os.environ["VERSION"])'
          git merge-base --is-ancestor HEAD origin/main
      - name: Resolve the compatibility window before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/check_compat.py
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Registry authentication for prior-release compatibility checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: python3 scripts/deploy/prepare_sources.py
      - name: Build once and test the candidate images
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          for service in bot postgres mcp; do
            case "$service" in
              bot) file=deploy/Dockerfile;;
              *) file="deploy/$service/Dockerfile";;
            esac
            docker buildx build --platform linux/amd64 --provenance=false --load \
              --cache-from "type=gha,scope=$service" --cache-to "type=gha,scope=$service,mode=max" \
              -f "$file" -t "ghcr.io/vigillover/shuiyuan-$service:$VERSION" .
          done
          export BOT_IMAGE="ghcr.io/vigillover/shuiyuan-bot:$VERSION"
          export POSTGRES_IMAGE="ghcr.io/vigillover/shuiyuan-postgres:$VERSION"
          export MCP_IMAGE="ghcr.io/vigillover/shuiyuan-mcp:$VERSION"
          docker run --rm "$BOT_IMAGE" python -c "import importlib.util; assert all(importlib.util.find_spec(m) is None for m in ('torch','sentence_transformers','neo4j','neomodel'))"
          python3 scripts/ci/integration.py
      - name: Publish tested images and immutable bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 scripts/ci/publish.py
      - name: Clean disposable integration stack
        if: always()
        run: docker compose -f deploy/compose.test.yaml down -v --remove-orphans
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-reports
          path: reports/
          retention-days: 14
